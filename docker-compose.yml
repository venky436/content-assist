name: content-assist

# Minimal dev compose — Docker runs ONLY the database. The server and
# admin run on the host with bun (`cd apps/server && bun run dev`,
# `cd apps/admin && bun run dev`). Nginx isn't needed for local dev.
#
# For a full single-droplet deployment (server + admin + nginx all
# containerised), see the archived files in docker/legacy/ — that path
# can be revisited once the dev loop is locked in.

services:
  postgres:
    image: postgres:16-alpine
    container_name: content-assist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-content_assist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-content_assist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - content-assist

networks:
  content-assist:
    driver: bridge

volumes:
  postgres_data:
