# Reverse proxy for the single-droplet deployment.
#
# Routing:
#   /api/*          → server container (strips /api prefix before forwarding)
#   /_next/*        → admin container (Next's static chunks, with long cache)
#   everything else → admin container (Next routes + SSR)
#
# Upgrade path for SSL: add `listen 443 ssl;` + cert paths once a domain
# is pointed at the droplet and certbot runs. HTTP is fine for dev.

upstream content_assist_server {
    server server:3000;
    keepalive 16;
}

upstream content_assist_admin {
    server admin:3001;
    keepalive 16;
}

# Max body size accommodates the biggest legitimate upload — video ingest
# caps at 50 MB server-side. Anything larger should be rejected at the
# edge, not eat server memory.
client_max_body_size 55m;

# Reasonable timeouts — video compose + Gemini calls can take up to ~30s
# total, so we allow 60s to be safe.
proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

server {
    listen 80 default_server;
    server_name _;

    # Forwarded headers so the server can rebuild its public origin URL
    # (e.g. for generated /videos/:id.mp4 links).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    # ---- API routes (server) ----
    # Strip the /api prefix before forwarding so the Hono routes keep their
    # original paths (/auth, /generate, /analyze, /videos/:id.mp4, etc.).
    location /api/ {
        proxy_pass http://content_assist_server/;
    }

    # ---- Next.js static assets (admin) ----
    # Long-cache the hashed chunks; Next handles its own invalidation.
    location /_next/static/ {
        proxy_pass http://content_assist_admin;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Admin (everything else) ----
    location / {
        proxy_pass http://content_assist_admin;
        proxy_cache_bypass $http_upgrade;
    }
}
